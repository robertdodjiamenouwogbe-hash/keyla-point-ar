name: keyla_point_ar
description: "Application de gestion des Agents Recruteurs - KEYLA DISTRIBUTION SARL / Celtiis Bénin"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.4
  cloud_firestore: ^4.15.5
  firebase_storage: ^11.6.6
  firebase_messaging: ^14.7.15

  # Offline storage
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  connectivity_plus: ^5.0.2

  # Routing
  go_router: ^13.2.0

  # Modèles / sérialisation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  equatable: ^2.0.5

  # Exports
  pdf: ^3.10.8
  excel: ^4.0.2
  csv: ^6.0.0
  share_plus: ^7.2.2
  url_launcher: ^6.2.5

  # Utils
  intl: ^0.19.0
  fl_chart: ^0.66.2
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
